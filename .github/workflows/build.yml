name: Build Forge mod
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build mod
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: MobsManeiros-forge-1.20.1
          path: build/libs/*.jar
          if-no-files-found: error
      - name: Publish GitHub Release
        if: github.event.head_commit.message == 'Publish Mobs Maneiros 1.0.1'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.0.1
          name: Mobs Maneiros 1.0.1 - Forge 1.20.1
          body: |
            Atualizacao do Mobs Maneiros para Minecraft 1.20.1 com Forge.
            Cachorro agora usa modelo de lobo com a textura personalizada.
            Empresario voa, ataca monstros hostis e invoca raios contra eles.
          files: build/libs/*.jar
          overwrite_files: true
          make_latest: true
